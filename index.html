<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Magyar Kaland</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Magyar Kaland">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#CDEBFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  html, body { height: 100%; margin: 0; background: #CDEBFF; overscroll-behavior: none; }
  body { overflow: hidden; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  #root { display: flex; height: 100%; flex: 1; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #CDEBFF; font: 700 22px system-ui, sans-serif; color: #24324A; }
  #boot img { width: 120px; height: 120px; border-radius: 28px; box-shadow: 0 8px 24px #1F3B6B33; }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot"><img src="icons/icon-180.png" alt="">Magyar Kaland</div>
<script>
  new MutationObserver(function (m, o) {
    if (document.getElementById("root").childElementCount) { var b = document.getElementById("boot"); if (b) b.remove(); o.disconnect(); }
  }).observe(document.getElementById("root"), { childList: true });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
<script src="app.js?v=5b76260fee" defer></script>
</body>
</html>
