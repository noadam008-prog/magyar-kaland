# Supabase pauses free projects after 7 days without activity. This reads her progress record every 3 days
# so the progress sync between her iPhone and iPad keeps working. The key is the public (publishable) key
# that the app itself already uses; it can only call the two progress functions.
name: Keep progress sync awake

on:
  schedule:
    - cron: "23 4 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the progress record
        env:
          URL: https://kmafqbicazphanusppij.supabase.co
          KEY: sb_publishable_Ui4A2HoMF65f_u4o_KesHg_2cFmu9SS
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/get_progress" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
              -d '{"p_code":"CTN2FVAB"}')
            echo "Supabase answered: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "Supabase did not answer. If the project was paused, restore it in the Supabase dashboard."
          exit 1
